```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Restas</title>
</head>
<body>

    <h1>Calculadora de Restas</h1>

    <input type="number" id="numero1" placeholder="Primer número">

    <input type="number" id="numero2" placeholder="Segundo número">

    <button onclick="restar()">Restar</button>

    <h3 id="resultado">Resultado: </h3>

    <script>
        function restar() {
            let num1 = Number(document.getElementById("numero1").value);
            let num2 = Number(document.getElementById("numero2").value);

            let resultado = num1 - num2;

            document.getElementById("resultado").textContent =
                "Resultado: " + resultado;
        }
    </script>

    <div>
    <input type="number" id="suma_n1">
    <span>+</span>
    <input type="number" id="suma_n2">
    <button onclick="calcularSuma()">Sumar</button>
    <span id="suma_res"></span>
</div>

<script>
    function calcularSuma() {
        let a = parseFloat(document.getElementById('suma_n1').value) || 0;
        let b = parseFloat(document.getElementById('suma_n2').value) || 0;
        document.getElementById('suma_res').innerText = a + b;
    }
</script>


</body>
</html>
