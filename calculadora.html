```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Restas</title>
</head>
<body>

    <h1>Calculadora de Restas</h1>

    <input type="number" id="numero1" placeholder="Primer número">

    <input type="number" id="numero2" placeholder="Segundo número">

    <button onclick="restar()">Restar</button>

    <h3 id="resultado">Resultado: </h3>

    <script>
        function restar() {
            let num1 = Number(document.getElementById("numero1").value);
            let num2 = Number(document.getElementById("numero2").value);

            let resultado = num1 - num2;

            document.getElementById("resultado").textContent =
                "Resultado: " + resultado;
        }
    </script>

</body>
</html>
```
